<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OlympTrack</title>
    <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
    <header>
        <h1>OlympTrack</h1>
        <nav>
            <a href="#olympiads">Олимпиады</a>
            <a href="#schedule">Расписание</a>
            <a href="#time">Учёт времени</a>
            <a href="#wishlist">Хочу попробовать</a>
            <a href="#mood">Настроение</a>
        </nav>
    </header>

    <main>
        <section id="olympiads">
            <h2>Олимпиады</h2>
            <div id="olympiads-list"></div>
            <button id="add-olympiad-btn">+ Добавить</button>
        </section>

        <section id="schedule">
            <h2>Расписание</h2>
            <div id="schedule-list"></div>
        </section>

        <section id="time">
            <h2>Учёт времени</h2>
            <div id="time-list"></div>
        </section>

        <section id="wishlist">
            <h2>Хочу попробовать</h2>
            <div id="wishlist-list"></div>
        </section>

        <section id="mood">
            <h2>Настроение</h2>
            <div id="mood-chart"></div>
        </section>
    </main>

    <script src="/static/js/api.js"></script>
    <script src="/static/js/olympiads.js"></script>
    <script src="/static/js/main.js"></script>
</body>
</html>
